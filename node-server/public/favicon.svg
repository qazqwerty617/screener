<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Dark Background Card Gradient -->
    <linearGradient id="favBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181a24" />
      <stop offset="100%" stop-color="#0b0d12" />
    </linearGradient>

    <!-- Metallic Silver Light Gradient -->
    <linearGradient id="silverLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#e2e8f0" />
      <stop offset="80%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>

    <!-- Metallic Midtone Gradient -->
    <linearGradient id="silverMid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1" />
      <stop offset="50%" stop-color="#64748b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- Dark Gunmetal Shadow Gradient -->
    <linearGradient id="obsidianDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="45%" stop-color="#1e293b" />
      <stop offset="90%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <filter id="crystalGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="100" fill="url(#favBg)" stroke="#2e3346" stroke-width="8" />

  <g transform="translate(0, 10) scale(0.96)" transform-origin="256 256" filter="url(#crystalGlow)">
    <!-- LEFT WING -->
    <polygon points="44,260 138,250 108,305" fill="url(#silverLight)" />
    <polygon points="44,260 108,305 200,470 138,250" fill="url(#obsidianDark)" opacity="0.9" />
    <polygon points="44,260 92,300 190,470" fill="url(#silverMid)" opacity="0.6" />

    <!-- RIGHT WING -->
    <polygon points="468,260 374,250 404,305" fill="url(#silverMid)" />
    <polygon points="468,260 404,305 312,470 374,250" fill="url(#obsidianDark)" opacity="0.95" />
    <polygon points="468,260 420,300 322,470" fill="url(#obsidianDark)" opacity="0.8" />

    <!-- CENTRAL MAIN SPEARHEAD -->
    <polygon points="256,20 138,250 256,488" fill="url(#silverLight)" />
    <polygon points="256,20 374,250 256,488" fill="url(#obsidianDark)" />

    <!-- SPECULAR ACCENTS -->
    <line x1="256" y1="20" x2="256" y2="488" stroke="#ffffff" stroke-width="3" opacity="0.85" />
    <line x1="138" y1="250" x2="256" y2="20" stroke="#ffffff" stroke-width="2" opacity="0.6" />
    <line x1="44" y1="260" x2="108" y2="305" stroke="#ffffff" stroke-width="2" opacity="0.7" />
  </g>
</svg>
