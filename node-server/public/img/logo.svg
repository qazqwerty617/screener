<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Metallic Silver/White Light Gradient -->
    <linearGradient id="silverLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#e2e8f0" />
      <stop offset="80%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>

    <!-- Metallic Midtone Gradient -->
    <linearGradient id="silverMid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1" />
      <stop offset="50%" stop-color="#64748b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- Dark Gunmetal/Obsidian Shadow Gradient -->
    <linearGradient id="obsidianDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="45%" stop-color="#1e293b" />
      <stop offset="90%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Wing Highlight Gradient -->
    <linearGradient id="wingLight" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="60%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>

    <!-- Subtle Glow Filter -->
    <filter id="crystalGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <g filter="url(#crystalGlow)">
    <!-- 1. LEFT WING (FLANKING SHARD) -->
    <!-- Left Wing Upper Facet -->
    <polygon points="44,260 138,250 108,305" fill="url(#silverLight)" />
    <!-- Left Wing Lower Main Body -->
    <polygon points="44,260 108,305 200,470 138,250" fill="url(#obsidianDark)" opacity="0.9" />
    <!-- Left Wing Thin Accent Spike -->
    <polygon points="44,260 92,300 190,470" fill="url(#silverMid)" opacity="0.6" />

    <!-- 2. RIGHT WING (FLANKING SHARD) -->
    <!-- Right Wing Upper Facet -->
    <polygon points="468,260 374,250 404,305" fill="url(#silverMid)" />
    <!-- Right Wing Lower Main Body -->
    <polygon points="468,260 404,305 312,470 374,250" fill="url(#obsidianDark)" opacity="0.95" />
    <!-- Right Wing Thin Accent Spike -->
    <polygon points="468,260 420,300 322,470" fill="url(#obsidianDark)" opacity="0.8" />

    <!-- 3. CENTRAL MAIN SPEARHEAD (LIGHT LEFT FACET) -->
    <polygon points="256,20 138,250 256,488" fill="url(#silverLight)" />

    <!-- 4. CENTRAL MAIN SPEARHEAD (DARK RIGHT FACET) -->
    <polygon points="256,20 374,250 256,488" fill="url(#obsidianDark)" />

    <!-- 5. SPECULAR CENTER RIDGE LINE -->
    <line x1="256" y1="20" x2="256" y2="488" stroke="#ffffff" stroke-width="2.5" opacity="0.85" />
    <line x1="138" y1="250" x2="256" y2="20" stroke="#ffffff" stroke-width="1.5" opacity="0.6" />
    <line x1="44" y1="260" x2="108" y2="305" stroke="#ffffff" stroke-width="1.5" opacity="0.7" />
  </g>
</svg>
