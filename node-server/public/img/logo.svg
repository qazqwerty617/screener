<svg xmlns="http://www.w3.org/2000/svg" viewBox="60 40 392 432" width="512" height="512">
  <defs>
    <linearGradient id="gemGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#4c1d95" />
    </linearGradient>
    <linearGradient id="gemGrad2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e9d5ff" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Glow Gem Polygon -->
  <g filter="url(#glow)">
    <!-- Top Diamond Face -->
    <polygon points="256,64 384,160 256,448 128,160" fill="url(#gemGrad1)" />
    <!-- Left Gem Shard -->
    <polygon points="256,64 128,160 256,272" fill="url(#gemGrad2)" opacity="0.95" />
    <!-- Right Gem Shard -->
    <polygon points="256,64 384,160 256,272" fill="#a78bfa" opacity="0.85" />
    <!-- Bottom Left Face -->
    <polygon points="128,160 256,448 256,272" fill="#581c87" opacity="0.95" />
    <!-- Bottom Right Face -->
    <polygon points="384,160 256,448 256,272" fill="url(#cyanGrad)" opacity="0.9" />
  </g>

  <!-- Specular Accent Lines -->
  <line x1="256" y1="64" x2="256" y2="448" stroke="#ffffff" stroke-width="4" opacity="0.4" />
  <line x1="128" y1="160" x2="384" y2="160" stroke="#ffffff" stroke-width="4" opacity="0.5" />
</svg>
