<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="logoGemGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#4c1d95" />
    </linearGradient>
    <linearGradient id="logoCyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <g filter="url(#logoGlow)">
    <polygon points="256,48 400,156 256,464 112,156" fill="url(#logoGemGrad)" />
    <polygon points="256,48 112,156 256,280" fill="#c084fc" opacity="0.95" />
    <polygon points="256,48 400,156 256,280" fill="#8b5cf6" opacity="0.85" />
    <polygon points="112,156 256,464 256,280" fill="#581c87" opacity="0.9" />
    <polygon points="400,156 256,464 256,280" fill="url(#logoCyanGrad)" opacity="0.85" />
  </g>
  <line x1="256" y1="48" x2="256" y2="464" stroke="#ffffff" stroke-width="4" opacity="0.35" />
  <line x1="112" y1="156" x2="400" y2="156" stroke="#ffffff" stroke-width="4" opacity="0.45" />
</svg>
